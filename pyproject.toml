[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-tree"
version = "0.1.0"
description = "Apple Silicon Prefix-Shared Tree Inference & Local GRPO LoRA Parameter Delta Trainer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Verifiable AI Architecture"}
]
dependencies = [
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
